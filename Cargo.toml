[package]
name = "Realtime-chat-app"
version = "0.1.0"
edition = "2024"

[dependencies]
actix = "0.13"
actix-files = "0.6"
actix-web = "4.0"
actix-web-actors = "4.2.0"
actix-cors="0.6"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0.108"
diesel = { version = "2.1.0", features = ["sqlite"] }
dotenv = "0.15"
chrono = "0.4"
uuid = { version = "0.8", features = ["serde", "v4"] }